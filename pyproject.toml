[project]
name = "devops-investigation-agent-langgraph"
version = "0.1.0"
description = "Local-first DevOps investigation agent using LangGraph, Ollama and MCP"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
